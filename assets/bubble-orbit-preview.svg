<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Bubble Orbit · 玻璃气泡物理场</title>
<desc id="desc">Glassmorphism frontend preview with draggable game bubbles inside a responsive square container.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a34"/><stop offset=".58" stop-color="#111d47"/><stop offset="1" stop-color="#082d3d"/></linearGradient>
  <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff"/><stop offset=".55" stop-color="#78eaff"/><stop offset="1" stop-color="#bba5ff"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".35"/></filter>
  <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse"><path d="M70 0H0V70" fill="none" stroke="#9bdcff" stroke-opacity=".1"/></pattern>
</defs>
<rect width="1440" height="900" rx="28" fill="url(#bg)"/>
<circle cx="130" cy="80" r="250" fill="#3b99dc" opacity=".16" filter="url(#blur)"/>
<circle cx="1270" cy="80" r="220" fill="#8d5be1" opacity=".15" filter="url(#blur)"/>
<text x="78" y="72" fill="#76eaff" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" font-weight="700" letter-spacing="3">INTERACTIVE PHYSICS PLAYGROUND</text>
<text x="78" y="168" fill="#fff" font-family="Arial,Microsoft YaHei,sans-serif" font-size="78" font-weight="700">玻璃气泡</text>
<text x="78" y="248" fill="url(#headline)" font-family="Arial,Microsoft YaHei,sans-serif" font-size="78" font-weight="700">自由漂浮，彼此弹开。</text>
<text x="80" y="300" fill="#a6bbd5" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17">慢速漂移 · 软碰撞 · 玻璃质感 · 可拖拽游戏气泡</text>
<rect x="72" y="430" width="350" height="1" fill="#9bdcff" opacity=".22"/>
<text x="72" y="390" fill="#eff8ff" font-family="Arial,sans-serif" font-size="24" font-weight="700">Lightweight motion, soft</text>
<text x="72" y="422" fill="#eff8ff" font-family="Arial,sans-serif" font-size="24" font-weight="700">collisions.</text>
<text x="72" y="470" fill="#a6bbd5" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14">拖动气泡，观察碰撞和形变；</text>
<text x="72" y="496" fill="#a6bbd5" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14">松手时会保留投掷速度。</text>
<rect x="72" y="560" width="120" height="42" rx="11" fill="#8ceeff"/><text x="91" y="587" fill="#062038" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14" font-weight="700">＋ 添加气泡</text>
<rect x="204" y="560" width="72" height="42" rx="11" fill="#18375f" stroke="#9bdcff" stroke-opacity=".3"/><text x="224" y="587" fill="#e8f4ff" font-family="Arial,Microsoft YaHei,sans-serif" font-size="14">暂停</text>
<rect x="680" y="112" width="680" height="680" rx="30" fill="#9ae5ff12" stroke="#afe4ff66" stroke-width="2" filter="url(#shadow)"/>
<rect x="699" y="131" width="642" height="642" rx="22" fill="#081c37aa" stroke="#9bdcff2a" stroke-width="2"/>
<rect x="699" y="131" width="642" height="642" rx="22" fill="url(#grid)"/>
<text x="700" y="95" fill="#8da8c6" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">RESPONSIVE CONTAINER</text>
<text x="1240" y="95" fill="#e4f2ff" font-family="Arial,sans-serif" font-size="13" font-weight="700">642 × 642</text>
<g font-family="Arial,Microsoft YaHei,sans-serif" font-weight="700" text-anchor="middle" filter="url(#shadow)">
  <g><circle cx="846" cy="300" r="86" fill="#2b86e866" stroke="#78e7ff" stroke-width="3"/><ellipse cx="815" cy="266" rx="22" ry="10" fill="#fff" opacity=".75" transform="rotate(-35 815 266)"/><circle cx="877" cy="267" r="4" fill="#fff" opacity=".55"/><text x="846" y="310" fill="#fff" font-size="24">贪吃蛇</text></g>
  <g><circle cx="1054" cy="262" r="70" fill="#764de266" stroke="#c4a6ff" stroke-width="3"/><ellipse cx="1030" cy="237" rx="18" ry="8" fill="#fff" opacity=".7" transform="rotate(-35 1030 237)"/><text x="1054" y="272" fill="#fff" font-size="24">2048</text></g>
  <g><circle cx="1200" cy="424" r="108" fill="#1cafa166" stroke="#96f4d4" stroke-width="3"/><ellipse cx="1168" cy="384" rx="25" ry="11" fill="#fff" opacity=".65" transform="rotate(-35 1168 384)"/><text x="1200" y="438" fill="#fff" font-size="23">奶龙消消乐</text></g>
  <g><circle cx="858" cy="555" r="86" fill="#e2787166" stroke="#ffd2a0" stroke-width="3"/><text x="858" y="565" fill="#fff" font-size="24">贪吃蛇</text></g>
  <g><circle cx="1085" cy="646" r="70" fill="#436ed366" stroke="#a9c6ff" stroke-width="3"/><text x="1085" y="656" fill="#fff" font-size="24">2048</text></g>
</g>
<text x="78" y="842" fill="#8da8c6" font-family="Arial,sans-serif" font-size="13">Bubble Orbit · Responsive Canvas Physics</text>
</svg>